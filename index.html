<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate PDF Preview</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif}
  .notice{padding:8px 12px;text-align:center;font-size:12px;color:#6b4f00;background:#fff8df;border-bottom:1px solid #ead89b}
  .viewer{width:100%;height:calc(100vh - 34px);border:0;display:block;background:#fff}
</style>
</head>
<body>
  <div class="notice">Unofficial copy — authenticity not verified by the issuing institution.</div>
  <iframe class="viewer" src="certificate.pdf#toolbar=0&navpanes=0&view=FitH" title="Certificate PDF preview"></iframe>
</body>
</html>
